<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Bajji architecture</title>
  <desc id="description">An M5Stack StopWatch uses Wi-Fi directly, with encrypted Bluetooth L2CAP and an iPhone Packet Tunnel as its fallback Internet path.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101d36"/>
    </linearGradient>
    <linearGradient id="watchFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1bd9ff"/>
      <stop offset="1" stop-color="#4274ff"/>
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172c4c"/>
      <stop offset="1" stop-color="#0b1628"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000814" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7ddcff"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="32" fill="url(#background)"/>
  <circle cx="1050" cy="34" r="210" fill="#2563eb" opacity=".08"/>
  <circle cx="132" cy="520" r="250" fill="#06b6d4" opacity=".06"/>

  <text x="56" y="66" fill="#f7fbff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700">Wi-Fi first. iPhone fallback.</text>
  <text x="56" y="98" fill="#9fb2ca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">The watch prefers its own Wi-Fi and switches to the encrypted BLE bridge when Wi-Fi is unavailable.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="135" width="285" height="285" rx="28" fill="#0d1b30" stroke="#29405f"/>
    <rect x="121" y="164" width="66" height="24" rx="10" fill="#1b2d48"/>
    <rect x="121" y="367" width="66" height="24" rx="10" fill="#1b2d48"/>
    <circle cx="154" cy="278" r="82" fill="#030812" stroke="#486986" stroke-width="8"/>
    <circle cx="154" cy="278" r="70" fill="url(#watchFace)"/>
    <circle cx="154" cy="278" r="58" fill="#07111f" opacity=".88"/>
    <path d="M123 286c17-29 45-29 62 0" fill="none" stroke="#65e6ff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="134" cy="260" r="7" fill="#65e6ff"/>
    <circle cx="174" cy="260" r="7" fill="#65e6ff"/>
    <text x="275" y="213" fill="#f7fbff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" text-anchor="middle">StopWatch</text>
    <text x="275" y="239" fill="#9fb2ca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">ESP32-S3</text>
    <text x="275" y="330" fill="#7ddcff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">10.77.0.2/30</text>
    <text x="275" y="352" fill="#9fb2ca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">lwIP · MTU 1280</text>
  </g>

  <path d="M365 278 H665" fill="none" stroke="#7ddcff" stroke-width="3" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="421" y="218" width="188" height="94" rx="18" fill="#12243f" stroke="#31557a"/>
  <path d="M453 251v-7a19 19 0 0 1 38 0v7" fill="none" stroke="#59e3ad" stroke-width="4" stroke-linecap="round"/>
  <rect x="445" y="250" width="54" height="38" rx="9" fill="#143f3a" stroke="#59e3ad"/>
  <circle cx="472" cy="268" r="4" fill="#59e3ad"/>
  <text x="573" y="252" fill="#f7fbff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Encrypted BLE</text>
  <text x="573" y="277" fill="#9fb2ca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">LE L2CAP CoC</text>
  <text x="515" y="342" fill="#7ddcff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">Bridge v1 · IPv4 frames</text>

  <g filter="url(#shadow)">
    <rect x="690" y="135" width="250" height="285" rx="28" fill="#0d1b30" stroke="#29405f"/>
    <rect x="746" y="159" width="138" height="238" rx="25" fill="#020713" stroke="#55708f" stroke-width="5"/>
    <rect x="757" y="174" width="116" height="208" rx="18" fill="url(#phoneScreen)"/>
    <rect x="793" y="182" width="44" height="7" rx="4" fill="#36506e"/>
    <circle cx="815" cy="239" r="29" fill="#123b5d" stroke="#45d8ff"/>
    <path d="M803 239l8 8 17-19" fill="none" stroke="#65e6ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="815" y="296" fill="#f7fbff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Packet Tunnel</text>
    <text x="815" y="321" fill="#7ddcff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">10.77.0.1/30</text>
    <text x="815" y="348" fill="#9fb2ca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">TCP · UDP · DNS</text>
  </g>

  <path d="M957 278 H1023" fill="none" stroke="#7ddcff" stroke-width="3" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="990" y="252" fill="#9fb2ca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Wi-Fi</text>
  <text x="990" y="318" fill="#9fb2ca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Cellular</text>

  <g filter="url(#shadow)">
    <path d="M1043 313c-23 0-42-17-42-39 0-19 14-35 33-39 7-32 35-56 69-56 38 0 69 29 71 65 17 7 29 23 29 42 0 25-21 46-47 46h-113c-11 0-20-8-20-19z" fill="#12365b" stroke="#4fc9f2" stroke-width="2"/>
    <text x="1099" y="269" fill="#f7fbff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Internet</text>
    <text x="1099" y="295" fill="#9fb2ca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" text-anchor="middle">HTTPS APIs</text>
  </g>

  <rect x="55" y="450" width="1090" height="42" rx="14" fill="#091426" stroke="#203754"/>
  <text x="600" y="477" fill="#9fb2ca" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">esp_http_client → lwIP → Wi-Fi (preferred) or Bridge v1 → iPhone → Internet</text>
</svg>
